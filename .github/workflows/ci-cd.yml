name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Instalar Google Chrome
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # 4️⃣ Instalar ChromeDriver
      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@v2
        with:
          version: latest

      # 5️⃣ Cache Maven para acelerar builds
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 6️⃣ Build Maven y correr tests
      - name: Build and run Maven tests
        run: mvn clean install

      # 7️⃣ Build Docker
      - name: Build Docker image
        run: docker build -t qa-automation .

      # 8️⃣ Ejecutar tests dentro de Docker
      - name: Run tests inside Docker
        run: docker run --rm qa-automation
